modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Mnesikos/SimplyCats/issues"

[[mods]]
    modId="${mod_id}"
    version="${minecraft_version}-${mod_version}"
    displayName="${mod_name}"
    updateJSONURL="https://raw.githubusercontent.com/Mnesikos/SimplyCats/forge/1.16.5/versions.json"
    displayURL="https://github.com/Mnesikos/SimplyCats/wiki"
    logoFile="logo.png"
    credits="${mod_credits}"
    authors="${mod_authors}"
    description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
